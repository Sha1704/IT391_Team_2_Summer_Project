name: Sync Fork

on:
  schedule:
    # Runs every hour
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/aiden-mccaslen/IT391_Team_2_Summer_Project.git

      - name: Sync with upstream
        run: |
          git fetch upstream
          git checkout main
          git merge upstream/main --ff-only

      - name: Push changes
        run: |
          git push origin main
